name: Release & Deploy Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- 1. 打包并创建 Release ----------
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package zip
        run: |
          mkdir -p dist
          zip -r dist/jian-yu-dan.zip . \
            -x "*.git*" \
               "node_modules/*" \
               "test-*.js" \
               "*.md" \
               ".github/*" \
               ".workbuddy/*" \
               "*.genie"
          ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jian-yu-dan.zip
          generate_release_notes: true
          draft: false
          prerelease: false

  # ---------- 2. 部署 GitHub Pages ----------
  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
